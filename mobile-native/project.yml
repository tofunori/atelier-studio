name: AtelierNative
options:
  bundleIdPrefix: com.tofunori.atelier
  deploymentTarget:
    iOS: '26.0'
packages:
  AtelierUI:
    path: .
targets:
  AtelierNative:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Atelier Pairing
            CFBundleURLSchemes: [atelier-native]
        NSMicrophoneUsageDescription: Dicter un message après avoir touché le microphone.
        NSSpeechRecognitionUsageDescription: Transcrire votre dictée pour la relire avant de l’envoyer.
        NSLocalNetworkUsageDescription: Accéder aux artefacts de vos projets sur votre Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: AtelierUI
    # Signature (identifiant, équipe, identité) : Config/Signing.xcconfig, qui
    # inclut Config/Local.xcconfig s'il existe. Ne pas remettre ces clés dans
    # `settings` ci-dessous : elles passeraient avant le xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: AtelierNative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atelier
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '6.0'
  AtelierNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AtelierNative
      - package: AtelierUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tofunori.atelier.swiftui.tests
        SWIFT_VERSION: '6.0'
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  AtelierNative:
    build:
      targets:
        AtelierNative: all
        AtelierNativeTests: [test]
    test:
      targets: [AtelierNativeTests]
