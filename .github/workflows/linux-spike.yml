# Spike Linux (2026-08-16) — répond à UNE question : jusqu'où va Atelier sur
# Linux, et surtout ce que WebKitGTK fait de la galerie et des éditeurs.
#
# Ce n'est PAS un workflow de release. Chaque étape est `continue-on-error` :
# le but est qu'un seul run dresse la carte complète des points de rupture,
# au lieu de s'arrêter au premier. Les journaux et captures partent en
# artefacts, y compris quand tout casse.
#
# Ce qu'il ne peut pas prouver : les performances réelles (Xvfb fait du rendu
# logiciel), Wayland, les dialogues natifs, le rendu des polices tel qu'un
# humain le voit.
name: spike linux

on:
  workflow_dispatch:
  push:
    branches: ["spike/linux-**"]

jobs:
  spike:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (WebKitGTK + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file \
            xvfb imagemagick x11-utils xdotool ghostscript fonts-dejavu-core
          echo "webkit2gtk: $(pkg-config --modversion webkit2gtk-4.1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target\nsrc-tauri -> target"

      - name: npm ci (racine + galerie)
        run: |
          npm ci
          npm --prefix gallery ci

      # `bundle.resources` de tauri.conf.json est FUSIONNÉ avec celui de
      # tauri.linux.conf.json, pas remplacé (constat du run 31965982985) : les
      # quatre ressources macOS survivent à l'override et Tauri refuse de
      # bundler parce que leurs dossiers n'existent pas ici. Des placeholders
      # vides suffisent au spike et ne touchent pas au chemin macOS.
      - name: placeholders des ressources macOS
        run: |
          # Les CLÉS de `resources` sont les chemins SOURCE (`node-dist`), pas
          # les destinations dans le bundle (`node-runtime`) — d'où les noms.
          for d in node-dist sidecar-dist mobile-dist appsnap-dist; do
            mkdir -p "src-tauri/$d"
            echo "Vide sur Linux — ressource macOS (spike)." > "src-tauri/$d/README"
          done
          ls -d src-tauri/*-dist

      # ---- Étape 1 : le backend compile-t-il pour Linux ? -------------------
      - name: cargo check — espace de travail rust/
        id: check_rust
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets \
            2>&1 | tee /tmp/check-rust.log

      # ---- Étape 2 : la coquille Tauri compile-t-elle ? ---------------------
      - name: cargo check — src-tauri
        id: check_tauri
        continue-on-error: true
        run: |
          set -o pipefail
          # NOTE : cargo check nu ne fusionne PAS tauri.linux.conf.json (c'est
          # la CLI qui le fait), il voit donc les ressources macOS. L'étape
          # « tauri build » est la seule qui juge vraiment.
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee /tmp/check-tauri.log

      # ---- Étape 3 : le frontend ------------------------------------------
      - name: build frontend
        id: build_front
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build-front.log

      # ---- Étape 4 : l'application complète --------------------------------
      - name: tauri build
        id: build_app
        continue-on-error: true
        run: |
          set -o pipefail
          npx tauri build --verbose 2>&1 | tee /tmp/build-app.log

      # Un projet FICTIF, pré-ouvert par le disque. Sans lui le run 3 n'a
      # montré que la coquille sur « No project open » : la galerie, l'éditeur
      # LaTeX et le visualiseur PDF n'avaient rien à rendre — or ce sont eux
      # qui font vraiment travailler WebKitGTK.
      # `continue-on-error` comme les autres : au run 31969575456, l'échec de
      # cette étape (politique PDF d'ImageMagick) a fait SAUTER le lancement et
      # perdu tout le run. Une fixture imparfaite doit dégrader, pas annuler.
      - name: projet fictif + état pré-ouvert
        continue-on-error: true
        run: |
          FIX="$HOME/projet-spike"
          mkdir -p "$FIX/figures"
          printf '%%%% figure de spike\n\\documentclass{article}\n\\begin{document}\nAlb\\''edo $\\alpha = 0.42$.\n\\end{document}\n' > "$FIX/memoire.tex"
          # deux PNG réels pour que la galerie ait des vignettes à produire
          convert -size 640x400 gradient:navy-white "$FIX/figures/fig1_albedo.png"
          convert -size 800x600 plasma:fractal "$FIX/figures/fig2_hypso.png"

          # PDF : Ubuntu livre ImageMagick avec une politique qui INTERDIT
          # l'écriture de PDF (« not allowed by the security policy `PDF' »,
          # run 31969575456) et sans police helvetica. On desserre la politique
          # pour ce runner jetable et on nomme une police réellement présente.
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' \
            /etc/ImageMagick-6/policy.xml || true
          convert -size 800x1000 xc:white -font DejaVu-Sans -pointsize 40 -fill black \
            -annotate +70+150 'Albedo Modis - spike' \
            -annotate +70+230 'Figure 3 : hypsometrie' "$FIX/figures/fig3_rapport.pdf" \
            || echo "PDF non généré — le visualiseur PDF restera non testé"
          ls -la "$FIX" "$FIX/figures"
          file "$FIX/figures/fig3_rapport.pdf" 2>/dev/null || true

          # `AppPaths::default_mac()` code ce chemin en dur : sur Linux il est
          # créé tel quel dans le home. C'est un des points à corriger, mais
          # ici ça nous sert.
          APPDIR="$HOME/Library/Application Support/atelier-studio"
          mkdir -p "$APPDIR"
          python3 - "$FIX" "$APPDIR/settings.json" <<'PY'
          import json, sys
          fixture, out = sys.argv[1], sys.argv[2]
          # `galleryExtsByProject` : sans pdf, la galerie filtre le fichier et
          # le visualiseur PDF reste intestable — le run 31970027074 a bien
          # produit le PDF, mais il n'apparaissait pas dans la grille.
          json.dump({"projects": [fixture], "activeView": "chats",
                     "defaultPermissionMode": "acceptEdits",
                     "galleryExtsByProject": {fixture: "png,jpg,jpeg,svg,pdf"}},
                    open(out, "w"), indent=2)
          print("settings.json semé ->", out)
          PY
          cat "$APPDIR/settings.json"

      # ---- Étape 5 : LA question — WebKitGTK rend-il l'app ? ---------------
      - name: lancement headless + captures
        id: run_app
        continue-on-error: true
        run: |
          set +e
          BIN="$(find src-tauri/target/release -maxdepth 1 -type f -perm -111 \
                 \( -name 'atelier' -o -name 'tauri-app' \) | head -1)"
          if [ -z "$BIN" ]; then
            echo "AUCUN BINAIRE PRODUIT — l'étape 4 n'a pas abouti" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "binaire : $BIN" | tee -a "$GITHUB_STEP_SUMMARY"

          Xvfb :99 -screen 0 1680x1050x24 &
          sleep 3
          export DISPLAY=:99
          # WebKitGTK écrit ses erreurs de rendu sur stderr : c'est LA source
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          "$BIN" > /tmp/app-stdout.log 2> /tmp/app-stderr.log &
          APP_PID=$!

          mkdir -p /tmp/shots
          shot() {  # $1 = nom
            xwininfo -root -tree > "/tmp/shots/windows-$1.txt" 2>&1
            import -window root "/tmp/shots/$1.png" 2>/dev/null \
              && echo "capture $1 : ok" || echo "capture $1 : ÉCHEC"
            kill -0 "$APP_PID" 2>/dev/null || echo "PROCESSUS MORT à l'étape $1"
          }

          # La fenêtre fait 800x600 à l'origine (constaté runs 3-5), donc les
          # coordonnées de l'écran et celles de l'app coïncident.
          sleep 45; shot 1-repos

          # 1) le .tex depuis « Recently modified » → il s'ouvre en onglet et
          #    active l'IDE (vérifié run 31970027074 : onglet « memoire.tex »
          #    dans le ruban, icône </> allumée).
          xdotool mousemove 420 286 click 1
          sleep 10; shot 2-apres-clic-tex

          # 2) layout « atelier » (3ᵉ bouton, ⌘2) : à 800x600 en « split », le
          #    panneau ne fait que ~250 px et gardait la galerie à l'écran.
          xdotool mousemove 722 18 click 1
          sleep 10; shot 3-pleine-largeur

          # 3) LE clic qui manquait : l'onglet « memoire.tex » DANS LE RUBAN.
          #    Ouvrir le fichier crée l'onglet mais ne bascule pas le panneau —
          #    c'est l'onglet qui sélectionne (runs 7 et 8). C'est ici que
          #    CodeMirror doit enfin apparaître.
          xdotool mousemove 248 18 click 1
          sleep 14; shot 4-editeur-latex

          # 4) retour galerie puis Rescan, pour que le pdf nouvellement permis
          #    entre dans la grille (le serveur a démarré avant le réglage)
          xdotool mousemove 581 18 click 1
          sleep 8
          xdotool mousemove 600 60 click 1
          sleep 10; shot 5-galerie-rescan

          # 4) dernier état, après que tout se soit posé
          sleep 10; shot 6-final

          kill "$APP_PID" 2>/dev/null
          {
            echo "### Sortie standard (30 dernières lignes)"
            echo '```'; tail -30 /tmp/app-stdout.log; echo '```'
            echo "### Erreurs (60 dernières lignes)"
            echo '```'; tail -60 /tmp/app-stderr.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: verdict
        if: always()
        run: |
          {
            echo "## Carte du spike Linux"
            echo "| Étape | Résultat |"
            echo "|---|---|"
            echo "| backend rust/ compile | ${{ steps.check_rust.outcome }} |"
            echo "| coquille src-tauri compile | ${{ steps.check_tauri.outcome }} |"
            echo "| frontend | ${{ steps.build_front.outcome }} |"
            echo "| application complète | ${{ steps.build_app.outcome }} |"
            echo "| lancement sous WebKitGTK | ${{ steps.run_app.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-linux
          if-no-files-found: warn
          path: |
            /tmp/*.log
            /tmp/shots/

      # Les paquets eux-mêmes, pour un essai sur une VRAIE machine — c'est la
      # seule façon de juger ce qu'un runner headless ne peut pas : la
      # fluidité (Xvfb fait du rendu logiciel), les polices, Wayland.
      - name: paquets installables (.deb + AppImage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-linux-paquets
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
