name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # macos-15 is the Apple Silicon image; Node and node-pty are arm64-only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/cache@v4
        with:
          path: .cache/node-runtime
          key: node-runtime-22.22.3-darwin-arm64
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install frontend deps
        run: npm ci
      - name: Install sidecar deps (pour le staging)
        run: cd sidecar && npm ci
      - name: Install gallery deps
        run: npm --prefix gallery ci
      - name: Install shared protocol deps
        run: npm --prefix packages/atelier-protocol ci
      - name: Install mobile deps
        run: npm --prefix mobile ci
      - name: Install Playwright browsers
        run: cd gallery && npx playwright install chromium webkit
      - name: Stage bundled resources for Tauri checks
        run: |
          bash scripts/stage-node-runtime.sh
          bash scripts/stage-sidecar.sh
          bash scripts/stage-gallery.sh
          bash scripts/stage-mobile.sh
          bash scripts/stage-rust-server.sh
          bash scripts/stage-appsnap.sh
      # le tag peut contourner la CI de PR : verify + E2E bloquent le bundle ici
      - name: Verify (typecheck, build, frontend, sidecar, gallery, Rust)
        run: npm run verify
        env:
          # The shipped gallery runtime is Node and the app backend is Rust.
          # Keep Python parity for local migration checks, but do not let the
          # legacy reference interpreter block production release runners.
          ATELIER_SKIP_LEGACY_PYTHON_PARITY: "1"
      - name: Gallery E2E
        run: npm run verify:e2e
      - name: Require matching release notes
        run: |
          test -f "docs/releases/${{ github.ref_name }}.md" || {
            echo "::error::docs/releases/${{ github.ref_name }}.md is missing — add release notes for this tag before releasing."
            exit 1
          }
      - name: Assemble release body
        id: release_body
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat "docs/releases/${{ github.ref_name }}.md"
            printf '\n---\n\n'
            echo '**Platform:** macOS on Apple Silicon.'
            printf '\n'
            echo 'The packaged app includes Node.js 22 and the gallery runtime. No'
            echo 'separate Node.js or Python installation is required for the app.'
            echo 'Claude Code CLI (2.1.139 or newer) and Codex CLI remain external'
            echo 'prerequisites for their respective providers.'
            printf '\n'
            echo 'If macOS Gatekeeper blocks an unsigned download, run:'
            echo '`xattr -cr "/Applications/Atelier.app"`'
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build + bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Atelier Studio ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: false
      - name: Verify packaged app artifact
        run: |
          APP="src-tauri/target/release/bundle/macos/Atelier.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          NODE="$APP/Contents/Resources/node-runtime/bin/node"
          test -x "$NODE"
          test "$("$NODE" --version)" = "v22.22.3"
          file "$NODE" | grep -q "arm64"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pas de --latest : l'app n'est pas encore notariée/signée Developer ID,
        # on ne veut pas la pousser comme "latest" par défaut tant que ce n'est
        # pas le cas (voir plan 064).
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
