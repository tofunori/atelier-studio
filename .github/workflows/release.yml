name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Mise à jour intégrée (src-tauri/src/updater.rs) : les binaires de release
# vérifient d'eux-mêmes la dernière version, et chaque paquet est signé par la
# clé du secret TAURI_SIGNING_PRIVATE_KEY (clé publique dans tauri.conf.json).
env:
  ATELIER_RELEASE_BUILD: "1"
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-macos:
    # macos-15 is the Apple Silicon image; the Rust binaries are arm64-only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Require the updater signing key
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY missing: in-app updates could not be signed (see docs/MISES_A_JOUR.md)."
            exit 1
          }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # même besoin que ci.yml : PDFium pour atelier-pdf (tests d'extraction
      # de `npm run verify`, et bibliothèque livrée dans l'app par le stage).
      - name: Fetch PDFium
        run: bash scripts/fetch-pdfium.sh
      - name: Install frontend deps
        run: npm ci
      - name: Install gallery deps
        run: npm --prefix gallery ci
      - name: Install notes deps
        run: npm --prefix gallery/notes-src ci
      - name: Install whiteboard deps
        run: npm --prefix gallery/whiteboard-src ci
      - name: Install shared protocol deps
        run: npm --prefix packages/atelier-protocol ci
      - name: Install Playwright browsers
        run: cd gallery && npx playwright install chromium webkit
      - name: Stage bundled resources for Tauri checks
        run: |
          bash scripts/stage-gallery.sh
          bash scripts/stage-rust-server.sh
          bash scripts/stage-appsnap.sh
      # le tag peut contourner la CI de PR : verify + E2E bloquent le bundle ici
      - name: Verify (typecheck, build, frontend, gallery, Rust)
        run: npm run verify
      - name: Gallery E2E
        run: npm run verify:e2e
      - name: Require matching release notes
        run: |
          test -f "docs/releases/${{ github.ref_name }}.md" || {
            echo "::error::docs/releases/${{ github.ref_name }}.md is missing — add release notes for this tag before releasing."
            exit 1
          }
      - name: Assemble release body
        id: release_body
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat "docs/releases/${{ github.ref_name }}.md"
            printf '\n---\n\n'
            echo '**Platform:** macOS on Apple Silicon.'
            echo 'Linux packages (.deb and AppImage, x86_64 and arm64) are attached when their build succeeds.'
            printf '\n'
            echo 'The packaged app includes the Rust backend and gallery runtime. No'
            echo 'separate Node.js or Python installation is required for the app.'
            echo 'Claude Code CLI (2.1.139 or newer) and Codex CLI remain external'
            echo 'prerequisites for their respective providers.'
            printf '\n'
            echo 'If macOS Gatekeeper blocks an unsigned download, run:'
            echo '`xattr -cr "/Applications/Atelier.app"`'
            printf '\n'
            echo 'Installation guide (first launch, agents, optional tools):'
            echo 'https://github.com/tofunori/atelier-studio/blob/main/docs/INSTALLATION.md'
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build + bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Atelier Studio ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: false
          # latest.json complet (Mac + Linux) écrit par le job updater-manifest
          includeUpdaterJson: false
      - name: Upload macOS updater signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # tauri-action publie l'archive sous Atelier_aarch64.app.tar.gz : la
        # signature prend le même nom, avec .sig
        run: |
          SIG="src-tauri/target/release/bundle/macos/Atelier.app.tar.gz.sig"
          test -s "$SIG"
          cp "$SIG" "$RUNNER_TEMP/Atelier_aarch64.app.tar.gz.sig"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Atelier_aarch64.app.tar.gz.sig" --clobber
      - name: Verify packaged app artifact
        run: |
          APP="src-tauri/target/release/bundle/macos/Atelier.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Le runtime Node embarqué a disparu (2026-08-22) : ce sont les
          # binaires Rust qu'on vérifie désormais — présents, exécutables,
          # arm64. Et on interdit explicitement le retour d'un Node livré.
          RS="$APP/Contents/Resources/rust-server"
          for BIN in atelier-studio-server atelier-gallery-server atelier-gallery-tool atelier-pdf; do
            test -x "$RS/$BIN"
            file "$RS/$BIN" | grep -q "arm64"
          done
          # PDFium livré et chargeable depuis le .app (pas de repli poppler) :
          # sans lui, le mode lecture et la base d'articles ne liraient rien.
          file "$RS/libpdfium.dylib" | grep -q "arm64"
          ATELIER_PDFIUM_LIB="$RS/libpdfium.dylib" "$RS/atelier-pdf" text gallery/tests/kb_parity/inputs/sample.pdf \
            | grep -q "Melting of Alpine Glaciers"
          if find "$APP" \( -name node -o -type d -name node-runtime -o -type d -name node_modules \) | grep -q .; then
            echo "ERREUR : un runtime Node est reparti dans le bundle"
            exit 1
          fi
          # Client web mobile/ gelé le 2026-09-28 (remplacé par mobile-native/) :
          # il ne doit plus être livré ni servi par la passerelle.
          if test -e "$APP/Contents/Resources/mobile"; then
            echo "ERREUR : le client web mobile/ est reparti dans le bundle"
            exit 1
          fi
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pas de --latest : l'app n'est pas encore notariée/signée Developer ID,
        # on ne veut pas la pousser comme "latest" par défaut tant que ce n'est
        # pas le cas (voir plan 064).
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Paquets Linux ajoutés à la release déjà publiée par build-macos : un échec
  # ici n'empêche jamais la sortie de la version Mac. Ubuntu 22.04 (glibc 2.35)
  # pour que les paquets s'installent aussi sur les distributions plus anciennes.
  build-linux:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file lsof xdg-utils ripgrep \
            libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
          workspaces: |
            src-tauri
            rust
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch PDFium
        run: bash scripts/fetch-pdfium.sh
      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix gallery ci
          npm --prefix gallery/notes-src ci
          npm --prefix gallery/whiteboard-src ci
          npm --prefix packages/atelier-protocol ci
      - name: Build Linux .deb + AppImage (${{ matrix.arch }})
        run: npm run tauri:build:app -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Upload Linux packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/*.deb.sig \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            --clobber

  # Manifeste de la mise à jour intégrée, une fois tous les paquets publiés :
  # un paquet Linux en échec n'empêche pas les autres de se mettre à jour.
  updater-manifest:
    needs: [build-macos, build-linux]
    if: ${{ !cancelled() && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIGS="$RUNNER_TEMP/sigs"
          mkdir -p "$SIGS"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$SIGS"
          bash scripts/updater-manifest.sh "$GITHUB_REF_NAME" "$SIGS" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" -R "$GITHUB_REPOSITORY" --clobber
