<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pont de thème d'Atelier (GAP-01) : le thème en cache s'applique avant
         la première peinture, le message atelier-theme de l'hôte le remplace. -->
    <script src="/.fig_thumbs/atelier_theme.js"></script>
    <link rel="stylesheet" href="/.fig_thumbs/scrollbars.css" />
    <script defer src="/.fig_thumbs/atelier_tooltip.js"></script>
    <title>Notes</title>
    <style>
      /* Toute couleur vient des jetons d'Atelier (atelier_theme.js) ; les
         replis sont la palette sombre par défaut, le temps que l'hôte réponde. */
      :root {
        --toolbar-h: var(--surface-header-height, 44px);
        --notes-bg: var(--surface-app, var(--bg, #1e2124));
        --notes-bar: var(--surface-header, var(--notes-bg));
        --notes-ink: var(--text-primary, var(--txt, #dadee3));
        --notes-ink2: var(--text-secondary, var(--fg, #b9bec4));
        --notes-muted: var(--text-muted, var(--muted, #90969d));
        --notes-rule: var(--border-subtle, var(--border, #2a2d31));
        --notes-hover: var(--surface-hover, color-mix(in srgb, var(--notes-ink) 6%, transparent));
        --notes-pressed: color-mix(in srgb, var(--notes-ink) 12%, transparent);
        --notes-pop: var(--surface-overlay, var(--card, #24282d));
        --notes-elev: var(--elevation-overlay, 0 4px 16px rgba(0,0,0,.25));
        --notes-font: var(--ui-font, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
        --notes-mono: var(--code-font, ui-monospace, SFMono-Regular, Menlo, monospace);
        --notes-ease: var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      }
      html, body, #app { margin: 0; padding: 0; width: 100%; }
      html, body { height: 100%; overflow: hidden; background: var(--notes-bg); color: var(--notes-ink); }

      /* ---- Barre du haut ---- */
      #toolbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 900;
        height: var(--toolbar-h); box-sizing: border-box;
        display: flex; align-items: center; gap: 4px;
        padding: 0 8px; overflow-x: auto; overflow-y: hidden;
        background: var(--notes-bar);
        border-bottom: 1px solid var(--notes-rule);
        font: 400 12px/1 var(--notes-font);
        -webkit-user-select: none; user-select: none;
        scrollbar-width: none;
      }
      #toolbar::-webkit-scrollbar { display: none; }
      #toolbar button {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 28px; height: 28px; padding: 0 6px; flex: 0 0 auto; box-sizing: border-box;
        background: transparent; color: var(--notes-muted);
        border: 0; border-radius: 6px;
        font: 500 12px/1 var(--notes-font); font-variant-numeric: tabular-nums; cursor: pointer;
        transition: background 120ms var(--notes-ease), color 120ms var(--notes-ease);
      }
      #toolbar button svg { width: 16px; height: 16px; display: block; }
      #toolbar button:hover { background: var(--notes-hover); color: var(--notes-ink); }
      /* état de la sélection (gras, titre, liste…) et mode courant : 12 %,
         toujours plus marqué que le survol (6 %) */
      #toolbar button[aria-pressed="true"] { background: var(--notes-pressed); color: var(--notes-ink); }
      #toolbar button:focus-visible { outline: var(--focus-ring-width, 1px) solid var(--focus-ring-color, var(--accent)); outline-offset: var(--focus-ring-offset, 1px); }
      #toolbar button b { font-weight: 600; }
      #toolbar button i { font-style: italic; }
      #toolbar button s { text-decoration: line-through; }
      #toolbar .sep { flex: 0 0 auto; width: 1px; height: 16px; background: var(--notes-rule); margin: 0 4px; }
      #toolbar .spacer { flex: 1 1 auto; }
      /* Mise en forme inerte en mode source */
      #toolbar.source-mode button[data-fmt] { opacity: .4; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #toolbar button { transition: none; } }

      /* ---- L'éditeur sous la barre ---- */
      #app { position: fixed; top: var(--toolbar-h); left: 0; right: 0; bottom: 0; overflow: auto; }
      /* Crepe ne peint que la hauteur de son contenu : l'étirer à la page */
      #app .milkdown, #app .milkdown > div { min-height: calc(100vh - var(--toolbar-h)); }

      /* ---- Crepe sur les jetons d'Atelier (GAP-01, GAP-04) ----
         Plus de thème Nord : seules les couleurs, ombres et polices de Crepe
         sont redéfinies, son common/style.css garde la mécanique. */
      #app .milkdown {
        --crepe-color-background: var(--notes-bg);
        --crepe-color-on-background: var(--notes-ink);
        --crepe-color-surface: var(--notes-pop);
        --crepe-color-surface-low: var(--surface-inset, var(--card2, #2c2f34));
        --crepe-color-on-surface: var(--notes-ink);
        --crepe-color-on-surface-variant: var(--notes-ink2);
        --crepe-color-outline: var(--notes-muted);
        --crepe-color-primary: var(--accent, #e77f3e);
        --crepe-color-secondary: var(--surface-inset, var(--card2, #2c2f34));
        --crepe-color-on-secondary: var(--notes-ink);
        --crepe-color-inverse: var(--notes-ink);
        --crepe-color-on-inverse: var(--notes-bg);
        --crepe-color-inline-code: var(--notes-ink2);
        --crepe-color-error: var(--status-error, #e06c75);
        --crepe-color-hover: var(--notes-hover);
        --crepe-color-selected: var(--selection-surface, color-mix(in srgb, var(--accent, #e77f3e) 22%, transparent));
        --crepe-color-inline-area: var(--surface-inset, var(--card2, #2c2f34));
        --crepe-font-default: var(--notes-font);
        --crepe-font-title: var(--notes-font);
        --crepe-font-code: var(--notes-mono);
        --crepe-shadow-1: var(--notes-elev);
        --crepe-shadow-2: var(--notes-elev);
      }
      /* Prose : 15 px / 1,5, mesure bornée et marges qui suivent la largeur */
      #app .milkdown .ProseMirror {
        box-sizing: border-box; max-width: calc(72ch + 2 * clamp(24px, 6vw, 72px)); margin: 0 auto;
        padding: 32px clamp(24px, 6vw, 72px) 96px;
      }
      #app .milkdown .ProseMirror p { font-size: 15px; line-height: 1.5; padding: 4px 0; }
      #app .milkdown .ProseMirror li p { padding: 2px 0; }
      #app .milkdown .ProseMirror h1, #app .milkdown .ProseMirror h2, #app .milkdown .ProseMirror h3,
      #app .milkdown .ProseMirror h4, #app .milkdown .ProseMirror h5, #app .milkdown .ProseMirror h6 {
        font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; padding: 0;
      }
      #app .milkdown .ProseMirror h1 { font-size: 20px; margin: 32px 0 12px; }
      #app .milkdown .ProseMirror h2 { font-size: 18px; margin: 28px 0 8px; }
      #app .milkdown .ProseMirror h3 { font-size: 15px; margin: 20px 0 4px; }
      #app .milkdown .ProseMirror h4, #app .milkdown .ProseMirror h5, #app .milkdown .ProseMirror h6 { font-size: 13px; margin: 16px 0 4px; }
      #app .milkdown .ProseMirror > :first-child { margin-top: 0; }
      #app .milkdown .ProseMirror a { color: var(--notes-ink); text-decoration-color: var(--notes-muted); text-underline-offset: 2px; }
      #app .milkdown .ProseMirror code { border-radius: 6px; padding: 0 4px; }
      #app .milkdown .ProseMirror pre { border-radius: 6px; }
      #app .milkdown .ProseMirror blockquote::before { width: 2px; background: var(--notes-rule); }
      #app .milkdown .ProseMirror blockquote { padding-left: 16px; color: var(--notes-ink2); }
      /* Surfaces flottantes de Crepe : modèle des menus d'Atelier (rayon 10,
         rangées 6, ombre douce, aucune bordure) */
      #app .milkdown .milkdown-slash-menu,
      #app .milkdown .milkdown-toolbar,
      #app .milkdown .milkdown-link-preview > .link-preview,
      #app .milkdown .milkdown-link-edit > .link-edit { border-radius: 10px; box-shadow: var(--notes-elev); }
      #app .milkdown .milkdown-slash-menu ul li,
      #app .milkdown .milkdown-toolbar .toolbar-item,
      #app .milkdown .milkdown-link-preview > .link-preview > .button,
      #app .milkdown .milkdown-link-preview > .link-preview > .link-icon { border-radius: 6px; }
      #app .milkdown .milkdown-slash-menu ul li, #app .milkdown .milkdown-slash-menu .tab-group ul li { font-size: 12px; }

      /* ---- Mode source Markdown ---- */
      #source {
        position: fixed; top: var(--toolbar-h); left: 0; right: 0; bottom: 0;
        display: none; box-sizing: border-box;
        margin: 0 auto; width: 100%; max-width: 860px;
        padding: 24px; border: 0; outline: none; resize: none;
        background: var(--notes-bg); color: var(--notes-ink);
        font: 13px/1.6 var(--notes-mono);
        white-space: pre; overflow: auto;
      }
      body.source-mode #app { display: none; }
      body.source-mode #source { display: block; }

      /* ---- Statut (GAP-05) : capsule sobre, comme celles du shell.
         Un nouvel essai tourne en silence ; seul un conflit, qui demande un
         choix, porte un point d'erreur et un bouton. ---- */
      #save-indicator {
        position: fixed; top: calc(var(--toolbar-h) + 8px); right: 16px; z-index: 1000;
        display: flex; align-items: center; gap: 8px; box-sizing: border-box;
        max-width: min(440px, calc(100vw - 32px)); padding: 4px 12px;
        font: 400 12px/1.5 var(--notes-font);
        color: var(--notes-ink2); background: var(--notes-pop);
        border-radius: 999px; box-shadow: var(--notes-elev);
        opacity: 0; transform: translateY(-4px); pointer-events: none; visibility: hidden;
        transition: opacity 140ms var(--notes-ease), transform 140ms var(--notes-ease), visibility 0s linear 140ms;
      }
      #save-indicator.show { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }
      #save-indicator .ind-spin { width: 12px; height: 12px; flex: none; color: var(--notes-muted); animation: notes-spin var(--motion-spin, .9s) linear infinite; }
      #save-indicator .ind-dot { width: 6px; height: 6px; flex: none; border-radius: 999px; background: var(--status-error, #e06c75); }
      #save-indicator.error { border-radius: 10px; padding: 8px 8px 8px 12px; align-items: flex-start; }
      #save-indicator.error .ind-dot { margin-top: 7px; }
      #save-indicator .ind-text { flex: 1 1 auto; min-width: 0; }
      #save-indicator .ind-act {
        flex: none; height: 24px; padding: 0 8px; border: 0; border-radius: 6px; cursor: pointer;
        background: var(--fill-primary, var(--border-default, var(--border-strong, #43474c)));
        color: var(--on-fill-primary, var(--notes-ink)); font: 500 12px/1 var(--notes-font);
        transition: background 120ms var(--notes-ease);
      }
      #save-indicator .ind-act:hover { background: var(--fill-primary-hover, var(--fill-primary, #43474c)); }
      #save-indicator .ind-act:focus-visible { outline: var(--focus-ring-width, 1px) solid var(--focus-ring-color, var(--accent)); outline-offset: var(--focus-ring-offset, 1px); }
      @keyframes notes-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #save-indicator { transition: none; transform: none; }
        #save-indicator .ind-spin { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Icônes : SVG au trait sur grille 16 (trait 1,4), jamais de caractère
         ni d'emoji (GAP-03). B, I, S et H1-H3 restent des lettres. -->
    <div id="toolbar" role="toolbar" aria-label="Mise en forme">
      <button data-fmt data-cmd="paragraph" title="Paragraphe" aria-label="Paragraphe"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3v10M12 3v10M12.5 3H6.75a2.75 2.75 0 0 0 0 5.5H9.5"/></svg></button>
      <button data-fmt data-cmd="h1" title="Titre 1">H1</button>
      <button data-fmt data-cmd="h2" title="Titre 2">H2</button>
      <button data-fmt data-cmd="h3" title="Titre 3">H3</button>
      <span class="sep"></span>
      <button data-fmt data-cmd="bold" title="Gras (⌘B)" aria-label="Gras"><b>B</b></button>
      <button data-fmt data-cmd="italic" title="Italique (⌘I)" aria-label="Italique"><i>I</i></button>
      <button data-fmt data-cmd="strike" title="Barré" aria-label="Barré"><s>S</s></button>
      <span class="sep"></span>
      <button data-fmt data-cmd="bullet" title="Liste à puces" aria-label="Liste à puces"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5h7M6.5 8h7M6.5 11.5h7"/><circle cx="3" cy="4.5" r=".9" fill="currentColor" stroke="none"/><circle cx="3" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="3" cy="11.5" r=".9" fill="currentColor" stroke="none"/></svg></button>
      <button data-fmt data-cmd="ordered" title="Liste numérotée" aria-label="Liste numérotée"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h6.5M7 11.5h6.5M2.5 3.2l1-.7v4M2.4 9.6a1 1 0 0 1 1.8.5c0 .9-1.8 1.6-1.8 2.4h1.9"/></svg></button>
      <button data-fmt data-cmd="task" title="Liste de tâches" aria-label="Liste de tâches"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 2.75h3.5v3.5H2.5zM2.5 9.75h3.5v3.5H2.5zM3.4 4.6l.8.8 1.4-1.7M8.5 4.5h5M8.5 11.5h5"/></svg></button>
      <button data-fmt data-cmd="quote" title="Citation" aria-label="Citation"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.5v9M6.5 5h7M6.5 8h7M6.5 11h4.5"/></svg></button>
      <button data-fmt data-cmd="code" title="Bloc de code" aria-label="Bloc de code"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5 1.75 8 5 11.5M11 4.5 14.25 8 11 11.5M9.25 3 6.75 13"/></svg></button>
      <button data-fmt data-cmd="link" title="Lien" aria-label="Lien"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.9 9.1a2.5 2.5 0 0 0 3.5 0l2.2-2.2a2.5 2.5 0 0 0-3.5-3.5l-.7.7M9.1 6.9a2.5 2.5 0 0 0-3.5 0L3.4 9.1a2.5 2.5 0 0 0 3.5 3.5l.7-.7"/></svg></button>
      <button data-fmt data-cmd="hr" title="Séparateur" aria-label="Séparateur"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8h11"/></svg></button>
      <span class="spacer"></span>
      <span class="sep"></span>
      <button class="mode" data-mode="source" title="Source Markdown" aria-label="Source Markdown" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h12v8H2zM4.5 10V6.25L6 8l1.5-1.75V10M10.75 6v3.75M9.25 8.5l1.5 1.5 1.5-1.5"/></svg></button>
      <button class="mode" data-mode="rich" title="Édition mise en forme" aria-label="Édition mise en forme" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.25 2.75 13.25 5.75 6 13H3v-3z"/></svg></button>
    </div>
    <div id="app"></div>
    <textarea id="source" spellcheck="false" aria-label="Source Markdown"></textarea>
    <div id="save-indicator" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
