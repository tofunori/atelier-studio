<script data-atelier-source="gallery/src/browser/pages/md_studio_1.ts">(function(){
  /* Jeton hors projet (Atelier Studio) : si l'app a ouvert cette page avec
     #atelier_token=… (fragment — jamais la query de navigation, plan 062
     étape 5), le propager à toutes les requêtes same-origin de la page —
     y compris celles de diff_versions.js. Sans jeton : comportement inchangé. */
  var tok         = null;
  window.__tokq = ""; /* suffixe "&token=…" pour les URLs hors fetch (pdf.js) */
  try{ var m = (location.hash||"").match(/atelier_token=([^&]+)/); tok = m ? decodeURIComponent(m[1]) : null; }catch(e){}
  if(!tok) return;
  window.__tokq = "&token=" + encodeURIComponent(tok);
  var orig = window.fetch.bind(window);
  window.fetch = function(input, init){
    try{
      var u = new URL(typeof input === "string" ? input : (input           ).url, location.href);
      if(u.origin === location.origin && !u.searchParams.has("token")){
        u.searchParams.set("token", tok);
        input = (typeof input === "string") ? (u.pathname + u.search) : new Request(u, input           );
      }
    }catch(e){}
    return orig(input, init);
  };
})();
</script>
<script data-atelier-source="gallery/src/browser/pages/md_studio_2.ts">(function(){
  try{ var m=(location.hash||'').match(/atelier_nonce=([\w-]+)/); if(m){ sessionStorage.setItem('atelier_nonce', m[1]); window.__atelierNonce = m[1]; } }catch(e){}
  /* nonce IPC : inclus dans chaque message vers l'app hôte ; l'app rejette sans lui */
  window.__atelierPost = function(p){
    try{ p = Object.assign({}, p, {nonce: (window.__atelierNonce || sessionStorage.getItem('atelier_nonce') || '')}); }catch(e){}
    try{ window.top.postMessage(p, '*'); }catch(e){}
  };
})();
</script>

<style>
  button,input,select,textarea{font-family:var(--ui-font)}
  :root{--ui-font:-apple-system,'SF Pro Text','Inter Variable',sans-serif;--code-font:ui-monospace,'SF Mono',Menlo,monospace;--bg:#212429;--bar:#1a1d22;--border:#333a45;--fg:#dadee3;--muted:#868d9a;--radius-control:6px}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:var(--ui-font)}
  /* Pas de barre de titre : le nom du fichier vit déjà dans l'onglet hôte.
     L'état de sauvegarde et le bouton ⌘S rejoignent la barre d'outils, à
     droite, en laissant la place aux contrôles flottants de l'hôte (étoile,
     commentaire, fermer) ancrés en haut à droite du cadre. */
  #mdTools{display:none;align-items:center;gap:8px;margin-left:auto;padding-right:128px;
    font-size:var(--fs-body-s, 12px);color:var(--muted);white-space:nowrap}
  #mdTools.mounted{display:flex}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-group:has(#mdTools){margin-left:auto}
  #state{font-variant-numeric:tabular-nums}
  #loadState{padding:24px;color:var(--muted);font:var(--fs-body,13px)/1.6 var(--ui-font)}
  #loadRetry{margin-top:12px;font:inherit;color:var(--fg);background:var(--surface-inset,var(--bar));border:1px solid var(--border);border-radius:var(--radius-control);padding:4px 12px}
  #save:disabled{opacity:.5;cursor:default}
  #loadRetry:focus-visible,#save:focus-visible{outline:var(--focus-ring-width,1px) solid var(--focus-ring-color,var(--accent));outline-offset:var(--focus-ring-offset,1px)}
  #state.dirty{color:var(--status-warning,#e0b74a)}
  #save{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border:none;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;padding:0;
    transition:background-color 150ms ease,color 150ms ease}
  #save:hover{background:var(--surface-inset,#2c313a);color:var(--fg)}
  #save svg{width:15px;height:15px}
  @media (prefers-reduced-motion:reduce){#save{transition:none}}
  #ed{height:100vh}
  /* Toast UI suit le thème de l'app (classe toastui-editor-dark posée d'après
     le color-scheme, voir md_studio_3.ts), et ses surfaces comme sa prose
     passent par les jetons : le rendu ne dépend plus de la palette codée en
     dur du thème Toast UI (paragraphes #fff sur fond crème en thème clair). */
  #ed .toastui-editor-defaultUI{border:0;color:var(--text-primary,var(--fg))}
  #ed .toastui-editor-defaultUI-toolbar{background:var(--bar)}
  #ed .ProseMirror, #ed .toastui-editor-contents{
    font-size:15px;line-height:1.65}
  #ed .toastui-editor-ww-container,#ed .toastui-editor-md-container,
  #ed .toastui-editor-main{background:var(--bg)}
  #ed .ProseMirror{color:var(--text-primary,var(--fg));caret-color:var(--text-primary,var(--fg))}
  #ed .toastui-editor-contents,#ed .toastui-editor-contents p,#ed .toastui-editor-contents div,
  #ed .toastui-editor-contents td,#ed .toastui-editor-contents td p,
  #ed .toastui-editor-contents h1,#ed .toastui-editor-contents h2,#ed .toastui-editor-contents h3,
  #ed .toastui-editor-contents h4,#ed .toastui-editor-contents h5,#ed .toastui-editor-contents h6{
    color:var(--text-primary,var(--fg))}
  #ed .toastui-editor-contents h1,#ed .toastui-editor-contents h2{border-color:var(--border-subtle,var(--border))}
  #ed .toastui-editor-contents ul,#ed .toastui-editor-contents ol{color:var(--text-primary,var(--fg))}
  #ed .toastui-editor-contents del{color:var(--text-muted,var(--muted))}
  #ed .toastui-editor-contents ul>li::before{background-color:var(--text-muted,var(--muted))}
  #ed .toastui-editor-contents blockquote{border-color:var(--border-strong,var(--border))}
  #ed .toastui-editor-contents blockquote p,#ed .toastui-editor-contents blockquote ul,
  #ed .toastui-editor-contents blockquote ol{color:var(--text-secondary,var(--muted))}
  #ed .toastui-editor-contents code{color:var(--text-primary,var(--fg));
    background-color:var(--surface-inset,var(--bar))}
  #ed .toastui-editor-contents pre{background-color:var(--surface-inset,var(--bar))}
  #ed .toastui-editor-contents pre code{background-color:transparent}
  #ed .toastui-editor-contents table,#ed .toastui-editor-contents table th,
  #ed .toastui-editor-contents table td{border-color:var(--border-subtle,var(--border))}
  #ed .toastui-editor-contents table th{background-color:var(--surface-inset,var(--bar));
    color:var(--text-primary,var(--fg))}
  #ed .toastui-editor-contents hr{border-color:var(--border-subtle,var(--border))}
  /* toolbar compacte et sobre */
  #ed .toastui-editor-defaultUI-toolbar{height:34px;padding:0 8px;
    border-bottom:1px solid var(--border)}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-icons{
    margin:5px 1px;border:none;border-radius:var(--radius-control);opacity:.5;
    transform:scale(.78);transform-origin:center}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-icons:hover{
    opacity:1;background-color:var(--surface-inset,#2c313a);border:none}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-icons.active{
    opacity:1;background-color:var(--surface-inset,#2c313a)}
  #ed .toastui-editor-toolbar-divider{margin:9px 6px;height:16px;
    background:var(--border)}
  .toastui-editor-defaultUI-toolbar button{border:none}
  #ed .toastui-editor-mode-switch{background:var(--bar);
    border-top:1px solid var(--border);font-size:var(--fs-label, 11px)}
  #ed .toastui-editor-mode-switch .tab-item{border-color:var(--border);background-color:var(--bar);
    color:var(--text-muted,var(--muted))}
  #ed .toastui-editor-mode-switch .tab-item.active{border-top-color:var(--bg);background-color:var(--bg);
    color:var(--text-primary,var(--fg))}
  .markdown-selection-actions{position:fixed;z-index:9999}
  .markdown-annotation-editor{position:fixed;z-index:10000;width:min(560px,calc(100vw - 16px));
    padding:12px;border:0;border-radius:10px;
    background:var(--selection-surface,#363b41);box-shadow:var(--elevation-overlay,var(--elev,0 4px 16px rgba(0,0,0,.25)))}
  ::highlight(markdown-amber){background-color:rgba(255,213,74,.40)}
  ::highlight(markdown-green){background-color:rgba(120,220,140,.40)}
  ::highlight(markdown-blue){background-color:rgba(120,170,255,.40)}
  ::highlight(markdown-red){background-color:rgba(255,140,160,.40)}

<body>
<div id="mdTools">
  <span id="state" role="status" aria-live="polite"></span>
  <button id="save" title="Sauvegarder (&#8984;S)" aria-label="Sauvegarder (Commande S)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5h8l2.5 2.5v8.5H3z"/><path d="M5.5 2.5v3.5h5V2.5M5.5 13.5V9.5h5v4"/></svg></button>
</div>
<div id="loadState"><div id="loadMessage" role="status" aria-live="polite">Chargement…</div><button id="loadRetry" type="button" hidden>Réessayer</button></div>
<div id="ed" hidden></div>
<script data-atelier-source="gallery/src/browser/pages/md_studio_3.ts">
const path = new URLSearchParams(location.search).get("path");
document.title = (path || "").split("/").pop() || "md studio";
const stateEl = (document.getElementById("state")                   );
let diskMtime = 0, dirty = false, editor = null, loading = true, selectionActions                           = null, saving = false, polling = false, localRevision = 0;
/* Version disque sur laquelle le tampon est tapé (base du brouillon de secours). */
let baseText         = null;

function setState(cls        , txt        ){ stateEl.className = cls; stateEl.textContent = txt; }

/* Brouillon de secours (audit 2026-10-18, problème 1) : le tampon modifié
   survit au démontage de l'iframe et revient, modifié, à la réouverture ;
   l'état « modifié » est publié à l'app, qui confirme avant de fermer.
   Sans le bundle partagé (chargement raté), l'éditeur reste utilisable,
   simplement sans filet. */
const studioCore = typeof AtelierStudioCore === "undefined" ? null : AtelierStudioCore;
const drafts = studioCore ? studioCore.createDraftKeeper({
  path,
  getText: () => editor ? editor.getMarkdown() : "",
  getBase: () => ({text: baseText, mtime: diskMtime}),
  isDirty: () => dirty,
  postToHost: (payload) => { if(window.__atelierPost) window.__atelierPost(payload); },
}) : {
  noteChange(){}, setDirty(_dirty         ){}, announce(){},
  restore: async (_adopt         ) => ({outcome: "none"         , savedAt: null                 }),
};
function setDirty(next         ){
  if(dirty === next) return;
  dirty = next;
  drafts.setDirty(next);
}

/* Thème Toast UI : suit le color-scheme qu'atelier_theme.js pose sur la racine
   (cache au chargement, puis message de l'hôte). Sans hôte, la palette
   autonome de la page est sombre. Toast UI réécrit la classe de son conteneur
   à chaque rendu Preact (bascule de mode) : un observateur la rétablit. */
function editorIsDark()          { return document.documentElement.style.colorScheme !== "light"; }
function syncEditorScheme(){
  const dark = editorIsDark();
  const host = document.getElementById("ed");
  for(const node of [host, host && host.querySelector(".toastui-editor-defaultUI")]){
    if(node && node.classList.contains("toastui-editor-dark") !== dark) node.classList.toggle("toastui-editor-dark", dark);
  }
}
window.addEventListener("atelier-theme-applied", syncEditorScheme);
function watchEditorScheme(){
  const ui = document.querySelector("#ed .toastui-editor-defaultUI");
  if(ui) new MutationObserver(syncEditorScheme).observe(ui, {attributes: true, attributeFilter: ["class"]});
  syncEditorScheme();
}

async function loadDocument(){
  const loadState = (document.getElementById("loadState")                  );
  const message = (document.getElementById("loadMessage")                  );
  const retry = (document.getElementById("loadRetry")                     );
  retry.hidden = true;
  message.textContent = "Chargement…";
  loadState.hidden = false;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const r = await fetch("/code?path=" + encodeURIComponent(path), {signal: controller.signal});
    const j = await r.json();
    if(!r.ok || j.error || typeof j.text !== "string" || !Number.isFinite(j.mtime)){
      throw new Error(j.error || ("Réponse invalide (HTTP " + r.status + ")"));
    }
    (document.getElementById("ed")                  ).hidden = false;
    diskMtime = j.mtime;
    baseText = j.text;
    editor = new toastui.Editor({
      el: (document.getElementById("ed")                  ),
      initialValue: j.text,
      initialEditType: "wysiwyg",
      previewStyle: "tab",
      height: "100%",
      theme: editorIsDark() ? "dark" : "light",
      usageStatistics: false,
      hideModeSwitch: false,
      toolbarItems: [
        ["heading", "bold", "italic", "strike"],
        ["hr", "quote"],
        ["ul", "ol", "task"],
        ["table", "link", "image", "code", "codeblock"],
        // dernier groupe = état + ⌘S, poussé à droite (voir CSS :has(#mdTools))
        [{ name: "mdTools", el: (document.getElementById("mdTools")                  ) }],
      ],
    });
    watchEditorScheme();
    editor.on("change", () => {
      if(loading) return;
      localRevision += 1; setDirty(true); drafts.noteChange(); setState("dirty", "modifié");
      if(selectionActions) selectionActions.refresh();
    });
    if(window.self !== window.top){
      selectionActions = AtelierStudioMarkdown.createMarkdownWysiwygSelection({
        path,
        getMarkdown: () => editor ? editor.getMarkdown() : "",
      });
    }
    loading = false;
    setState("", "");
    (document.getElementById("mdTools")                  ).classList.add("mounted");
    loadState.hidden = true;
    const restored = await drafts.restore((draft) => {
      const plan = studioCore.planDraftRestore(draft, {text: j.text, mtime: j.mtime});
      if(plan.outcome === "none") return "none";
      loading = true;
      editor.setMarkdown(plan.text, false);
      loading = false;
      baseText = plan.base; diskMtime = plan.baseMtime; localRevision += 1;
      setDirty(true);
      return plan.outcome;
    });
    if(restored.outcome !== "none"){
      const when = studioCore.formatDraftTime(restored.savedAt);
      setState("dirty", "brouillon non enregistré" + (when ? " du " + when : "") + " restauré"
        + (restored.outcome === "conflict" ? " — le fichier a changé depuis, ⌘S signalera le conflit" : " — ⌘S pour l'enregistrer"));
      if(selectionActions) selectionActions.refresh();
    }
  } catch(error) {
    (document.getElementById("ed")                  ).hidden = true;
    message.textContent = "Impossible de charger le document : " + (error.name === "AbortError" ? "délai dépassé" : error.message);
    retry.hidden = false;
  } finally { clearTimeout(timeout); }
}
(document.getElementById("loadRetry")                     ).onclick = loadDocument;
void loadDocument();

async function save(){
  if(!editor || loading || saving) return;
  const text = editor.getMarkdown();
  const button = (document.getElementById("save")                     );
  saving = true; button.disabled = true; button.setAttribute("aria-busy", "true");
  setState("", "sauvegarde…");
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const r = await fetch("/codesave", {method:"POST", signal:controller.signal, headers:{"Content-Type":"application/json"},
      body: JSON.stringify({path, text, mtime: diskMtime})});
    const j = await r.json();
    if(j.error === "conflit"){
      if(Number.isFinite(j.mtime)) diskMtime = j.mtime;
      setDirty(true); setState("dirty", "conflit disque — re-⌘S pour écraser"); return;
    }
    if(!r.ok || j.error || !Number.isFinite(j.mtime)) throw new Error(j.error || ("Réponse invalide (HTTP " + r.status + ")"));
    diskMtime = j.mtime; localRevision += 1; baseText = text;
    // Une retouche faite pendant l'écriture n'appartient pas au texte confirmé.
    setDirty(editor.getMarkdown() !== text);
    setState(dirty ? "dirty" : "", dirty ? "modifié" : "sauvegardé " + new Date().toLocaleTimeString());
  } catch(error) {
    setDirty(true);
    setState("dirty", "Échec de la sauvegarde : " + (error.name === "AbortError" ? "délai dépassé — réessayer" : error.message));
  } finally {
    clearTimeout(timeout); saving = false; button.disabled = false; button.removeAttribute("aria-busy");
  }
}
(document.getElementById("save")                     ).onclick = save;
document.addEventListener("keydown", (e) => {
  if((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); save(); }
});

// Recharge les changements externes seulement tant que le tampon reste propre.
setInterval(async () => {
  if(!editor || loading || saving || polling) return;
  polling = true;
  const revision = localRevision;
  try{
    const j = await (await fetch("/code?path=" + encodeURIComponent(path) + "&statonly=1")).json();
    if(j.mtime && Math.abs(j.mtime - diskMtime) > 0.001){
      if(dirty || saving){ setState("dirty", "le fichier a changé sur disque"); return; }
      const full = await (await fetch("/code?path=" + encodeURIComponent(path))).json();
      if(revision !== localRevision || dirty || saving || typeof full.text !== "string" || !Number.isFinite(full.mtime)) return;
      loading = true;
      diskMtime = full.mtime; baseText = full.text;
      editor.setMarkdown(full.text, false);
      if(selectionActions) selectionActions.refresh();
      loading = false;
      setState("", "rechargé (modifié sur disque)");
    }
  }catch(e){} finally { polling = false; loading = false; }
}, 2000);
</script>
</body>
</html>
