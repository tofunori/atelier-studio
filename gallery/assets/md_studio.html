<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>md studio</title>
<script src="/.fig_thumbs/atelier_theme.js"></script>
<link rel="stylesheet" href="/.fig_thumbs/toastui/toastui-editor.min.css">
<link rel="stylesheet" href="/.fig_thumbs/toastui/toastui-editor-dark.min.css">
<script>(function(){
  /* Jeton hors projet (Atelier Studio) : si l'app a ouvert cette page avec
     #atelier_token=… (fragment — jamais la query de navigation, plan 062
     étape 5), le propager à toutes les requêtes same-origin de la page —
     y compris celles de diff_versions.js. Sans jeton : comportement inchangé. */
  var tok = null;
  window.__tokq = ""; /* suffixe "&token=…" pour les URLs hors fetch (pdf.js) */
  try{ var m = (location.hash||"").match(/atelier_token=([^&]+)/); tok = m ? decodeURIComponent(m[1]) : null; }catch(e){}
  if(!tok) return;
  window.__tokq = "&token=" + encodeURIComponent(tok);
  var orig = window.fetch.bind(window);
  window.fetch = function(input, init){
    try{
      var u = new URL(typeof input === "string" ? input : input.url, location.href);
      if(u.origin === location.origin && !u.searchParams.has("token")){
        u.searchParams.set("token", tok);
        input = (typeof input === "string") ? (u.pathname + u.search) : new Request(u, input);
      }
    }catch(e){}
    return orig(input, init);
  };
})();</script>
<script>(function(){
  try{ var m=(location.hash||'').match(/atelier_nonce=([\w-]+)/); if(m){ sessionStorage.setItem('atelier_nonce', m[1]); window.__atelierNonce = m[1]; } }catch(e){}
  /* nonce IPC : inclus dans chaque message vers l'app hôte ; l'app rejette sans lui */
  window.__atelierPost = function(p){
    try{ p = Object.assign({}, p, {nonce: (window.__atelierNonce || sessionStorage.getItem('atelier_nonce') || '')}); }catch(e){}
    try{ window.top.postMessage(p, '*'); }catch(e){}
  };
})();</script>
<script src="/.fig_thumbs/toastui/toastui-editor-all.min.js"></script>
<link rel="stylesheet" href="/.fig_thumbs/annotation_ui.css">
<script src="/.fig_thumbs/markdown_features.bundle.js"></script>
<style>
  button,input,select,textarea{font-family:var(--ui-font)}
  :root{--ui-font:-apple-system,'SF Pro Text','Inter Variable',sans-serif;--code-font:ui-monospace,'SF Mono',Menlo,monospace;--bg:#212429;--bar:#1a1d22;--border:#333a45;--fg:#dadee3;--muted:#868d9a;--radius-control:4px}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:var(--ui-font)}
  /* Pas de barre de titre : le nom du fichier vit déjà dans l'onglet hôte.
     L'état de sauvegarde et le bouton ⌘S rejoignent la barre d'outils, à
     droite, en laissant la place aux contrôles flottants de l'hôte (étoile,
     commentaire, fermer) ancrés en haut à droite du cadre. */
  #mdTools{display:none;align-items:center;gap:8px;margin-left:auto;padding-right:128px;
    font-size:var(--fs-body-s, 12px);color:var(--muted);white-space:nowrap}
  #mdTools.mounted{display:flex}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-group:has(#mdTools){margin-left:auto}
  #state{font-variant-numeric:tabular-nums}
  #state.dirty{color:#ffd54a}
  #save{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border:none;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;padding:0;
    transition:background-color 150ms ease,color 150ms ease}
  #save:hover{background:var(--surface-inset,#2c313a);color:var(--fg)}
  #save svg{width:15px;height:15px}
  @media (prefers-reduced-motion:reduce){#save{transition:none}}
  #ed{height:100vh}
  #ed .toastui-editor-defaultUI{border:0}
  .toastui-editor-dark .toastui-editor-defaultUI-toolbar{background:var(--bar)}
  .toastui-editor-dark .ProseMirror, .toastui-editor-dark .toastui-editor-contents{
    font-size:15px;line-height:1.65}
  .toastui-editor-dark .toastui-editor-ww-container,
  .toastui-editor-dark .toastui-editor-main{background:var(--bg)}
  /* toolbar compacte et sobre */
  .toastui-editor-dark .toastui-editor-defaultUI-toolbar{height:34px;padding:0 8px;
    border-bottom:1px solid var(--border)}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-icons{
    margin:5px 1px;border:none;border-radius:var(--radius-control);opacity:.5;
    transform:scale(.78);transform-origin:center}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-icons:hover{
    opacity:1;background-color:var(--surface-inset,#2c313a);border:none}
  .toastui-editor-defaultUI-toolbar .toastui-editor-toolbar-icons.active{
    opacity:1;background-color:var(--surface-inset,#2c313a)}
  .toastui-editor-dark .toastui-editor-toolbar-divider{margin:9px 6px;height:16px;
    background:var(--border)}
  .toastui-editor-defaultUI-toolbar button{border:none}
  .toastui-editor-dark .toastui-editor-mode-switch{background:var(--bar);
    border-top:1px solid var(--border);font-size:var(--fs-label, 11px)}
  .markdown-selection-actions{position:fixed;z-index:9999}
  .markdown-annotation-editor{position:fixed;z-index:10000;width:min(560px,calc(100vw - 16px));
    padding:10px;border:1px solid var(--selection-border,#777e87);border-radius:16px;
    background:var(--selection-surface,#363b41);box-shadow:0 8px 28px #0007}
  ::highlight(markdown-amber){background-color:rgba(255,213,74,.40)}
  ::highlight(markdown-green){background-color:rgba(120,220,140,.40)}
  ::highlight(markdown-blue){background-color:rgba(120,170,255,.40)}
  ::highlight(markdown-red){background-color:rgba(255,140,160,.40)}
</style>
</head>
<body>
<div id="mdTools">
  <span id="state">chargement…</span>
  <button id="save" title="Sauvegarder (&#8984;S)" aria-label="Sauvegarder (Commande S)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5h8l2.5 2.5v8.5H3z"/><path d="M5.5 2.5v3.5h5V2.5M5.5 13.5V9.5h5v4"/></svg></button>
</div>
<div id="ed"></div>
<script>
const path = new URLSearchParams(location.search).get("path");
document.title = (path || "").split("/").pop() || "md studio";
const stateEl = document.getElementById("state");
let diskMtime = 0, dirty = false, editor = null, loading = true, selectionActions = null;

function setState(cls, txt){ stateEl.className = cls; stateEl.textContent = txt; }

fetch("/code?path=" + encodeURIComponent(path)).then(async r => {
  const j = await r.json().catch(() => ({}));
  // erreur serveur (404 hors racine / fichier absent…) : l'afficher au lieu d'un éditeur vide muet
  if(!r.ok || typeof j.text !== "string"){
    setState("dirty", "erreur");
    const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    document.getElementById("ed").innerHTML = '<div style="padding:24px;color:var(--muted,#9aa3af);font:13px/1.6 -apple-system,sans-serif">' +
      'Impossible de charger <b>' + esc(path || "(aucun chemin)") + '</b><br>' +
      esc(j.error || ("HTTP " + r.status)) + '</div>';
    return;
  }
  diskMtime = j.mtime;
  editor = new toastui.Editor({
    el: document.getElementById("ed"),
    initialValue: j.text,
    initialEditType: "wysiwyg",
    previewStyle: "tab",
    height: "100%",
    theme: "dark",
    usageStatistics: false,
    hideModeSwitch: false,
    toolbarItems: [
      ["heading", "bold", "italic", "strike"],
      ["hr", "quote"],
      ["ul", "ol", "task"],
      ["table", "link", "image", "code", "codeblock"],
      // dernier groupe = état + ⌘S, poussé à droite (voir CSS :has(#mdTools))
      [{ name: "mdTools", el: document.getElementById("mdTools") }],
    ],
  });
  editor.on("change", () => {
    if(loading) return;
    dirty = true; setState("dirty", "modifié");
    if(selectionActions) selectionActions.refresh();
  });
  if(window.self !== window.top){
    selectionActions = AtelierStudioMarkdown.createMarkdownWysiwygSelection({
      path,
      getMarkdown: () => editor ? editor.getMarkdown() : "",
    });
  }
  setTimeout(() => { loading = false; }, 300);
  setState("", "");
  document.getElementById("mdTools").classList.add("mounted");
});

async function save(){
  if(!editor) return;
  const r = await fetch("/codesave", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({path, text: editor.getMarkdown(), mtime: diskMtime})});
  const j = await r.json();
  if(j.error === "conflit"){ setState("dirty", "conflit disque — re-⌘S pour écraser"); diskMtime = j.mtime; return; }
  diskMtime = j.mtime; dirty = false; setState("", "sauvegardé " + new Date().toLocaleTimeString());
}
document.getElementById("save").onclick = save;
document.addEventListener("keydown", (e) => {
  if((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); save(); }
});

// reload auto si Claude modifie le fichier sur disque (buffer propre seulement)
setInterval(async () => {
  try{
    const j = await (await fetch("/code?path=" + encodeURIComponent(path) + "&statonly=1")).json();
    if(j.mtime && Math.abs(j.mtime - diskMtime) > 0.001){
      if(dirty){ setState("dirty", "le fichier a changé sur disque (Claude ?)"); return; }
      const full = await (await fetch("/code?path=" + encodeURIComponent(path))).json();
      loading = true;
      diskMtime = full.mtime;
      editor.setMarkdown(full.text, false);
      if(selectionActions) selectionActions.refresh();
      setTimeout(() => { loading = false; }, 300);
      setState("", "rechargé (modifié sur disque)");
    }
  }catch(e){}
}, 2000);

</script>
</body>
</html>
