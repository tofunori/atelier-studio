<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Atelier · connecter Claude</title>
<style>
/* Page de connexion du connecteur Atelier pour Claude. Système d'Atelier :
   tailles 12/13/15, poids 400/500/600, rayons 6/10, espacements ×4. */
:root {
  --bg: #F5F4ED; --card: #FFFFFF; --sunk: #F0EEE6; --fg: #141413; --fg2: #3D3D3A;
  --muted: #73726C; --ok-bg: #E9F1DC; --ok-fg: #265B19; --err: #7F2C28; --info: #3266AD;
  --elev: 0 4px 16px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1F1E1D; --card: #30302E; --sunk: #262624; --fg: #FAF9F5; --fg2: #C2C0B6;
    --muted: #9C9A92; --ok-bg: #1B4614; --ok-fg: #7AB948; --err: #EE8884; --info: #80AADD;
    --elev: 0 4px 16px rgba(0,0,0,.25); }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--fg); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.card { width: 100%; max-width: 380px; background: var(--card); border-radius: 10px; padding: 20px; box-shadow: var(--elev); }
.hd { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.mark { width: 24px; height: 24px; border-radius: 6px; background: var(--sunk); display: grid; place-items: center; }
h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; margin: 0; }
p { margin: 0 0 12px; color: var(--fg2); }
.small { font-size: 12px; color: var(--muted); }
label { display: block; font-size: 12px; font-weight: 500; color: var(--fg2); margin-bottom: 4px; }
input[type=password] { width: 100%; font: inherit; color: var(--fg); background: var(--sunk); border: 0; border-radius: 6px; padding: 8px 12px; }
input[type=password]:focus, button:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
button { border: 0; font: inherit; font-size: 12px; font-weight: 500; padding: 8px 16px; border-radius: 6px; cursor: pointer;
  background: var(--ok-bg); color: var(--ok-fg); transition: opacity .14s, transform .12s; }
button:active { transform: scale(.97); }
.err { color: var(--err); font-size: 12px; margin: 0 0 12px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="card">
  <div class="hd">
    <span class="mark"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></span>
    <h1>Connecter Claude à Atelier</h1>
  </div>
  <p>Claude demande à lire tes fichiers LaTeX et à te proposer des révisions. Rien n'est écrit dans un fichier sans ton clic sur Accepter.</p>
  {{error}}
  <form method="post" action="/authorize" {{form_hidden}}>
    {{hidden}}
    <label for="secret">Ton code Atelier</label>
    <input id="secret" name="secret" type="password" autocomplete="current-password" autofocus required>
    <div class="row">
      <button type="submit">Autoriser</button>
      <span class="small">Pour refuser, ferme cette page.</span>
    </div>
  </form>
</main>
</body>
</html>
