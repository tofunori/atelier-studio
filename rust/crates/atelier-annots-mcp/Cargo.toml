[package]
name = "atelier-annots-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "stdio MCP server: Atelier PDF annotations and personal notes for Claude Desktop, plus highlighting a quoted passage"

[[bin]]
name = "atelier-annots-mcp"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
roxmltree = "0.20"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
