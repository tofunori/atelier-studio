[package]
name = "atelier-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Lecture de PDF par PDFium (texte, mots, lignes, images) aux formats de sortie de poppler"

[lib]
path = "src/lib.rs"

[[bin]]
name = "atelier-pdf"
path = "src/main.rs"

[dependencies]
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# Passages cités (passage.rs) : sortie bbox et normalisation du texte.
roxmltree = "0.20"
unicode-normalization = "0.1"
# Vignettes PNG (thumb.rs) : déjà dans l'arbre de dépendances.
flate2 = "1"
crc32fast = "1"

# Copie corrigée (corrige.rs) : commentaires lus en JSON, largeurs des glyphes.
serde = { workspace = true }
serde_json = { workspace = true }
ttf-parser = "0.25"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
