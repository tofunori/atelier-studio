[package]
name = "tauri-app"
version = "1.5.5"
description = "Atelier Studio — agentic research environment (Tauri 2 desktop shell)"
authors = ["Thierry St-Pierre"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
dirs = "5"
libc = "0.2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
tauri-plugin-dialog = "2"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# binaires livrés dans le bundle : LTO thin + strip ≈ -30 à -50 % de taille,
# quelques points de CPU ; le coût est du temps de build release uniquement
lto = "thin"
codegen-units = 1
strip = "symbols"
